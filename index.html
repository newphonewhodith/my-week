footer{height:calc(24px + env(safe-area-inset-bottom))}

/* ---------- details sheet ---------- */
.modal{position:fixed; inset:0; z-index:50; background:rgba(61,31,45,.28); display:flex; align-items:flex-end; justify-content:center}
.modal[hidden]{display:none}
.sheet{width:100%; max-width:460px; background:var(--white); border-radius:22px 22px 0 0; padding:24px 22px calc(22px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 40px rgba(143,42,85,.18); animation:up .2s ease-out}
@media (min-width:600px){ .modal{align-items:center} .sheet{border-radius:22px} }
@keyframes up{from{transform:translateY(24px); opacity:0}}
@media (prefers-reduced-motion:reduce){ .sheet{animation:none} }
.sheet .cat{display:inline-flex; align-items:center; gap:7px; font-size:.66rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--rose)}

.sheet a{color:var(--rose)}

.btn-done{background:var(--rose); color:var(--white); border:1px solid var(--rose)}

.btn-done:disabled{opacity:.45; cursor:not-allowed}

.sheet{max-height:92vh; overflow:auto; -webkit-overflow-scrolling:touch}
.sheet-links{display:flex; justify-content:center; gap:28px; margin-top:16px}
.sheet-links button{border:0; background:none; color:var(--rose); font-weight:600; font-size:.8rem; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; padding:6px}
.sheet-links button.danger{color:var(--ink-soft)}
.repeat-note{font-size:.72rem; color:var(--ink-soft); letter-spacing:.04em}
.evform{display:grid; gap:12px}
.evform label{display:grid; gap:5px; font-size:.64rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft)}

  border:0; background:var(--rose); color:var(--white); font-size:30px; font-weight:300; line-height:1; cursor:pointer; box-shadow:0 8px 24px rgba(196,73,124,.35); display:grid; place-items:center}

<body>

<header class="hero">
  <p class="eyebrow">Weekly planner</p>
  <h1 class="brand">My Week</h1>
</header>

<div class="topbar">
  <button class="round" id="prevBtn" aria-label="Previous week">‹</button>
  <div class="week-title"><b id="weekLabel"></b><small id="weekSub"></small></div>
  <button class="pill" id="todayBtn">Today</button>
  <button class="round" id="nextBtn" aria-label="Next week">›</button>
</div>

<div class="wrap layout">
 <div class="main-col">
  <div class="past-banner" id="pastBanner" hidden>
    <span id="pastBannerText">Past week · view only</span>
    <button id="editBtn">Fix a check-off</button>
  </div>

  <div class="progress"><div class="bar"><span id="progressFill"></span></div><span id="progressText"></span></div>
  <div class="legend" id="legend"></div>

  <main>
    <section class="list-view" id="listView" aria-label="Day by day"></section>
    <section class="grid-view" id="gridView" aria-label="Week view"></section>
  </main>

 </div>

 <aside class="side">
  <section class="panel">
    <div class="panel-head"><h2>To-do</h2><small id="todosCount"></small></div>
    <ul class="items" id="todosList"></ul>
    <form class="add" data-add="todos"><input type="text" placeholder="Add a to-do…" aria-label="Add a to-do" enterkeyhint="done"><button type="submit">Add</button></form>
  </section>
  <section class="panel">
    <div class="panel-head"><h2>Grocery list</h2><small id="groceriesCount"></small></div>
    <ul class="items" id="groceriesList"></ul>
    <form class="add" data-add="groceries"><input type="text" placeholder="Add an item…" aria-label="Add a grocery item" enterkeyhint="done"><button type="submit">Add</button></form>
  </section>
  <section class="panel" id="syncPanel" hidden>
    <div class="panel-head"><h2>Sync</h2><small id="syncState"></small></div>
    <form id="signInForm" class="signin">
      <p class="hint">Sign in once on each device to share your check-offs and lists.</p>
      <input type="email" id="syncEmail" placeholder="Email" autocomplete="username" autocapitalize="off" required>
      <input type="password" id="syncPass" placeholder="Password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
      <p class="hint err" id="syncErr"></p>
    </form>
    <div id="signedIn" class="signed-in" hidden>
      <span id="syncWho"></span>
      <button type="button" id="signOutBtn">Sign out</button>
    </div>
  </section>
 </aside>

 <section class="panel past-panel">
   <h2>Past weeks</h2>
   <ul class="past-list" id="pastList"></ul>
 </section>
</div>

<footer style="height:90px"></footer>

<button class="fab" id="addBtn" aria-label="Add event">+</button>

<div class="modal" id="modal" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
</div>

<script>
/* =====================================================================
   SAVE / LOAD — the ONLY place that touches storage.
   Everything is saved on this device first (localStorage), then synced
   to Supabase when SYNC is filled in and you're signed in, so your
   iPhone and iPad share the same check-offs and lists.
   ===================================================================== */
// Cloud sync settings (from Supabase → Project Settings → API). Leave blank to stay device-only.
const SYNC = {
  url: "https://fomuxeimdbgyagqgbajp.supabase.co",
  key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvbXV4ZWltZGJneWFncWdiYWpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4NDU4MjcsImV4cCI6MjEwODQyMTgyN30.60z03z3_2tGsRklSSOXE7ljBCPBqwpZM_niA9F29EGo",   // anon key (safe to be public)
};

const Store = (() => {
  const PREFIX = "myweek:v1:";
  const AUTH = "myweek:auth", PENDING = "myweek:pending", MERGED = "myweek:merged:";
  const cache = {};
  const ls = {
    get(k) { try { const v = localStorage.getItem(k); return v == null ? null : JSON.parse(v); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  };
  const enabled = () => !!(SYNC.url && SYNC.key);
  let session = ls.get(AUTH);
  let pending = new Set(ls.get(PENDING) || []);
  let onChange = () => {}, onStatus = () => {};
  let status = { state: !enabled() ? "off" : session ? "synced" : "signedout", msg: "" };
  const setStatus = (state, msg = "") => { status = { state, msg }; onStatus(status); };
  const savePending = () => ls.set(PENDING, [...pending]);
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

  // ---- this device ----
  function loadLocal() {
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(PREFIX)) {
          try { cache[k.slice(PREFIX.length)] = JSON.parse(localStorage.getItem(k)); } catch (e) {}
        }
      }
    } catch (e) { /* storage blocked — run from memory */ }
  }
  const saveLocal = (key, value) => ls.set(PREFIX + key, value);

  // ---- Supabase (plain fetch, no libraries) ----
  async function auth(grant, body) {
    const r = await fetch(`${SYNC.url}/auth/v1/token?grant_type=${grant}`, {
      method: "POST", headers: { apikey: SYNC.key, "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      if (grant === "refresh_token") { session = null; ls.del(AUTH); throw new Error("signedout"); }
      throw new Error(j.error_description || j.msg || j.message || "Sign-in failed");
    }
    session = { access: j.access_token, refresh: j.refresh_token, exp: Date.now() + (j.expires_in || 3600) * 1000, user: j.user && j.user.id, email: j.user && j.user.email };
    ls.set(AUTH, session);
  }
  async function api(path, opts = {}, retry = true) {
    if (!session) throw new Error("signedout");
    if (Date.now() > session.exp - 60000) await auth("refresh_token", { refresh_token: session.refresh });
    const r = await fetch(`${SYNC.url}/rest/v1/${path}`, {
      ...opts, headers: { apikey: SYNC.key, Authorization: `Bearer ${session.access}`, "Content-Type": "application/json", ...(opts.headers || {}) },
    });
    if (r.status === 401 && retry) { session.exp = 0; return api(path, opts, false); }
    if (!r.ok) throw new Error("Sync error (" + r.status + ")");
    return r;
  }
  // Combine two versions of the same saved item (used once, the first time a device signs in).
  function mergeValues(cloud, local) {
    if (Array.isArray(cloud) && Array.isArray(local)) {
      const objs = arr => arr.every(x => x && typeof x === "object" && "id" in x);
      if (objs(cloud) && objs(local)) {
        const map = new Map(cloud.map(x => [x.id, x]));
        for (const x of local) { const c = map.get(x.id); if (!c || (x.done && !c.done)) map.set(x.id, x); }
        return [...map.values()];
      }
      return [...new Set([...cloud, ...local])];
    }
    if (cloud && local && typeof cloud === "object" && typeof local === "object") return { ...cloud, ...local };
    return local ?? cloud;
  }

  let running = null, again = false;
  async function sync() {
    if (!enabled() || !session) return;
    if (running) { again = true; return running; }
    running = (async () => {
      setStatus("syncing");
      try {
        const first = !ls.get(MERGED + session.user);
        const rows = await (await api("kv?select=key,value")).json();
        const inCloud = new Set();
        let changed = false;
        for (const { key, value } of rows) {
          inCloud.add(key);
          let v = value;
          if (first && key in cache) { v = mergeValues(value, cache[key]); if (!same(v, value)) pending.add(key); }
          else if (pending.has(key)) continue;           // unsent change on this device wins
          if (!same(cache[key], v)) { cache[key] = v; saveLocal(key, v); changed = true; }
        }
        if (first) { for (const k of Object.keys(cache)) if (!inCloud.has(k)) pending.add(k); ls.set(MERGED + session.user, true); }
        savePending();
        if (pending.size) {
          const keys = [...pending];
          await api("kv?on_conflict=user_id,key", {
            method: "POST", headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
            body: JSON.stringify(keys.map(k => ({ key: k, value: cache[k] ?? null, updated_at: new Date().toISOString() }))),
          });
          keys.forEach(k => pending.delete(k)); savePending();
        }
        setStatus("synced");
        if (changed) onChange();
      } catch (e) {
        if (e.message === "signedout") setStatus("signedout", "Please sign in again.");
        else if (e instanceof TypeError || !navigator.onLine) setStatus("offline");
        else setStatus("error", e.message);
      } finally {
        running = null;
        if (again) { again = false; setTimeout(sync, 50); }
      }
    })();
    return running;
  }
  let pushTimer;
  function persist(key, value) {
    saveLocal(key, value);
    pending.add(key); savePending();
    clearTimeout(pushTimer); pushTimer = setTimeout(sync, 500);
  }

  const get = (k, fallback) => (k in cache ? cache[k] : fallback);
  const set = (k, v) => { cache[k] = v; persist(k, v); };
  const toggle = (k, id, on) => { const m = { ...get(k, {}) }; if (on) m[id] = true; else delete m[id]; set(k, m); };

  return {
    async init() {
      loadLocal();
      if (enabled()) {
        sync();
        document.addEventListener("visibilitychange", () => { if (!document.hidden) sync(); });
        window.addEventListener("online", sync);
        setInterval(() => { if (!document.hidden) sync(); }, 60000);
      }
    },
    getChecks: date => get("checks:" + date, {}),          // { eventId: true } for that date
    setCheck: (date, id, on) => toggle("checks:" + date, id, on),
    // Running lists (to-do, groceries): [{ id, text, done: "YYYY-MM-DD" | null }]
    getList: name => get("list:" + name, []),
    setList: (name, items) => set("list:" + name, items),
    getSeeded: name => get("seeded:" + name, []),
    // Your in-app event changes: "ev:added", "ev:over" (single days), "ev:series" (this & following weeks)
    getData: (k, fallback) => get(k, fallback),
    setData: (k, v) => set(k, v),
    setSeeded: (name, ids) => set("seeded:" + name, ids),
    // sync controls
    syncEnabled: enabled,
    status: () => status,
    email: () => (session && session.email) || "",
    onChange: fn => (onChange = fn),
    onStatus: fn => (onStatus = fn),
    async signIn(email, password) { await auth("password", { email, password }); setStatus("syncing"); await sync(); },
    signOut() { session = null; ls.del(AUTH); setStatus("signedout"); },
  };
})();

/* ===================== helpers ===================== */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const mondayOf = d => addDays(d, -((d.getDay() + 6) % 7));
const DAY_KEYS = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];
const DAY_NAMES = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function fmtTime(t, withSuffix = true) {
  let [h, m] = t.split(":").map(Number);
  const ap = h % 24 >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return withSuffix ? `${h}:${pad(m)} ${ap}` : `${h}:${pad(m)}`;
}
function fmtRange(e) {
  if (e.allDay) return "All day";
  const same = (toMin(e.start) < 720) === (toMin(e.end) < 720);
  return `${fmtTime(e.start, !same)} – ${fmtTime(e.end)}`;
}
function weekLabel(mon) {
  const sun = addDays(mon, 6);
  return mon.getMonth() === sun.getMonth()
    ? `${MONTHS[mon.getMonth()]} ${mon.getDate()}–${sun.getDate()}`
    : `${MONTHS[mon.getMonth()]} ${mon.getDate()} – ${MONTHS[sun.getMonth()]} ${sun.getDate()}`;
}
const catOf = e => CATEGORIES[e.category] || { label: e.category, bg: "#fdf3f7", ac: "#d98aaa" };
const catStyle = e => { const c = catOf(e); return `--bg:${c.bg};--ac:${c.ac}`; };
const nowLabel = () => fmtTime(`${Math.floor(nowMin / 60)}:${pad(nowMin % 60)}`);

/* ===================== schedule logic ===================== */
function scheduleForWeek(weekKey) {
  let pick = null;
  for (const s of BASE_SCHEDULES) if (s.from <= weekKey && (!pick || s.from > pick.from)) pick = s;
  return pick;
}
/* Events you add or change in the app are layered on top of the lists above:
   - ev:added  → new events (one-off with "date", or weekly with "day" + "from")
   - ev:series → "this and following weeks" changes, by event id, each starting on a week's Monday
   - ev:over   → "this day only" changes, keyed "eventId@YYYY-MM-DD"
   Earlier weeks are never touched, so past weeks stay exactly as they were. */
const FIELDS = ["title", "start", "end", "allDay", "category", "location", "notes"];
const fieldsOf = e => ({ title: e.title || "", start: e.start || "", end: e.end || "", allDay: !!e.allDay, category: e.category || "wellness", location: e.location || "", notes: e.notes || "" });
const edits = () => ({ added: Store.getData("ev:added", []), over: Store.getData("ev:over", {}), series: Store.getData("ev:series", {}) });

function seriesAt(series, id, weekKey) {
  return (series[id] || []).filter(c => c.from <= weekKey).sort((a, b) => (a.from < b.from ? -1 : 1)).pop();
}
function eventsForDate(key) {
  const d = parseKey(key), wk = keyOf(mondayOf(d));
  const sched = scheduleForWeek(wk);
  const dk = DAY_KEYS[(d.getDay() + 6) % 7];
  const { added, over, series } = edits();
  const fileOnce = ONE_OFF_EVENTS.filter(e => e.date === key);
  const hidden = new Set(fileOnce.flatMap(e => e.replaces || []));

  const weekly = [
    ...(sched ? sched.events : []).map(e => ({ ...e, source: "file-weekly" })),
    ...added.filter(a => a.day && a.from <= wk).map(e => ({ ...e, source: "user-weekly" })),
  ].map(e => {
    const ch = seriesAt(series, e.id, wk);
    if (!ch) return e;
    return ch.deleted ? null : { ...e, ...ch.fields, day: ch.day || e.day };
  }).filter(e => e && e.day === dk && !hidden.has(e.id));

  const once = [
    ...fileOnce.filter(e => !e.cancel).map(e => ({ ...e, source: "file-once" })),
    ...added.filter(a => a.date === key).map(e => ({ ...e, source: "user-once" })),
  ];

  let list = [...weekly, ...once].map(e => ({ ...e, date: key, overKey: e.id + "@" + key }));
  list = list.flatMap(e => {
    const o = e.source !== "user-once" && over[e.overKey];
    if (!o) return [e];
    if (o.deleted || (o.date && o.date !== key)) return [];
    return [{ ...e, ...o.fields }];
  });
  for (const [k, o] of Object.entries(over)) {             // single days moved to this date
    const at = k.lastIndexOf("@"), id = k.slice(0, at), src = k.slice(at + 1);
    if (!o.deleted && o.date === key && src !== key) list.push({ id, ...o.fields, date: key, source: "moved", overKey: k, movedFrom: src });
  }
  return list.sort((a, b) => (!!a.allDay === !!b.allDay ? 0 : a.allDay ? -1 : 1) || (a.allDay ? 0 : toMin(a.start) - toMin(b.start)));
}
const isWeekly = e => e.source === "file-weekly" || e.source === "user-weekly";
function weekStats(monKey) {
  let total = 0, done = 0;
  const mon = parseKey(monKey);
  for (let i = 0; i < 7; i++) {
    const key = keyOf(addDays(mon, i));
    const checks = Store.getChecks(key);
    const evs = eventsForDate(key);
    total += evs.length;
    done += evs.filter(e => checks[e.id]).length;
  }
  return { total, done };
}

/* ===================== state ===================== */
let viewMonday = mondayOf(new Date());
let editMode = false;
let todayKey = keyOf(new Date());
let nowMin = 0;
let openEvent = null;

const currentMonKey = () => keyOf(mondayOf(new Date()));
const viewKey = () => keyOf(viewMonday);
const isPastWeek = () => viewKey() < currentMonKey();
const locked = () => isPastWeek() && !editMode;
const isNow = e => e.date === todayKey && !e.allDay && nowMin >= toMin(e.start) && nowMin < toMin(e.end);

/* ===================== rendering ===================== */
function checkbox(e, done, cls) {
  const box = `<input type="checkbox" ${cls ? `class="${cls}"` : ""} data-check data-key="${e.date}" data-id="${esc(e.id)}"
    ${done ? "checked" : ""} ${locked() ? "disabled" : ""} aria-label="Mark ${esc(e.title)} done">`;
  return cls ? box : `<label class="check">${box}</label>`;
}

function renderList(days) {
  $("#listView").innerHTML = days.map(({ d, key, events, checks }, i) => {
    const isToday = key === todayKey;
    const doneCount = events.filter(e => checks[e.id]).length;
    let rows = "", nowPlaced = !isToday;
    for (const e of events) {
      if (!nowPlaced && !e.allDay && toMin(e.start) > nowMin) {
        rows += `<div class="now-mark">Now · ${nowLabel()}</div>`;
        nowPlaced = true;
      }
      const done = !!checks[e.id];
      const meta = [`<span class="cat-name">${esc(catOf(e).label)}</span>`, e.location ? esc(e.location) : ""].filter(Boolean).join(" · ");
      rows += `<div class="ev ${done ? "done" : ""} ${isNow(e) ? "now" : ""}" style="${catStyle(e)}"
          data-open data-key="${key}" data-id="${esc(e.id)}" role="button" tabindex="0">
        <div class="ev-time">${fmtRange(e)}</div>
        <div><div class="ev-title">${esc(e.title)}${isNow(e) ? '<span class="now-tag">NOW</span>' : ""}</div>
          <div class="ev-meta">${meta}</div></div>
        ${checkbox(e, done)}
      </div>`;
    }
    if (!nowPlaced && events.length) rows += `<div class="now-mark">Now · ${nowLabel()}</div>`;
    if (!events.length) rows = `<div class="empty">Nothing scheduled</div>`;
    return `<article class="day ${isToday ? "today" : ""}" id="day-${key}">
      <div class="day-head"><span class="day-name">${DAY_NAMES[i]}</span><span class="day-date">${MONTHS[d.getMonth()]} ${d.getDate()}</span>
        ${isToday ? '<span class="badge">Today</span>' : ""}
        ${events.length ? `<span class="day-count">${doneCount} of ${events.length}</span>` : ""}</div>
      ${rows}</article>`;
  }).join("");
}

function layoutDay(events) {
  // Long blocks (2h+) sit full-width in the background; shorter events
  // layered on top get the right-hand side so they stay readable.
  const items = events.filter(e => !e.allDay)
    .map(e => ({ e, s: toMin(e.start), en: Math.max(toMin(e.end), toMin(e.start) + 15) }))
    .sort((a, b) => a.s - b.s || b.en - a.en);
  const bg = items.filter(it => toMin(it.e.end) - it.s >= 120);
  const fg = items.filter(it => !bg.includes(it));
  const overlaps = (a, b) => a.s < b.en && b.s < a.en;
  const clusters = []; let cur = [], curEnd = -1;
  for (const it of bg) { it.lane = 0; it.lanes = 1; it.left = 0; it.width = 100; it.z = 1; }
  // background blocks that overlap each other still split side by side
  for (const it of bg) {
    const clash = bg.filter(o => o !== it && overlaps(o, it));
    if (clash.length) { const grp = [it, ...clash].sort((a, b) => a.s - b.s); const i = grp.indexOf(it); it.width = 100 / grp.length; it.left = i * it.width; }
  }
  for (const it of fg) {
    if (cur.length && it.s >= curEnd) { clusters.push(cur); cur = []; curEnd = -1; }
    cur.push(it); curEnd = Math.max(curEnd, it.en);
  }
  if (cur.length) clusters.push(cur);
  for (const c of clusters) {
    const lanes = [];
    for (const it of c) {
      let i = lanes.findIndex(end => end <= it.s);
      if (i < 0) { i = lanes.length; lanes.push(0); }
      lanes[i] = it.en; it.lane = i;
    }
    const onBg = c.some(it => bg.some(b => overlaps(b, it)));
    const start = onBg ? 34 : 0, span = 100 - start;
    c.forEach(it => { it.lanes = lanes.length; it.width = span / lanes.length; it.left = start + it.lane * it.width; it.z = 2; });
  }
  return items;
}

function renderGrid(days) {
  const HOUR = 56;
  const timed = days.flatMap(x => x.events.filter(e => !e.allDay));
  let startH = 7, endH = 22;
  for (const e of timed) { startH = Math.min(startH, Math.floor(toMin(e.start) / 60)); endH = Math.max(endH, Math.ceil(toMin(e.end) / 60)); }
  endH = Math.min(endH, 24);
  const height = (endH - startH) * HOUR;
  const y = m => ((m - startH * 60) / 60) * HOUR;

  const heads = days.map(({ d, key }, i) =>
    `<div class="gh ${key === todayKey ? "today" : ""}"><b>${DAY_NAMES[i].slice(0, 3)}</b><small>${d.getDate()}</small></div>`).join("");

  const hasAllDay = days.some(x => x.events.some(e => e.allDay));
  const allDay = hasAllDay ? `<div class="g-row allday"><div class="lbl">All day</div>${days.map(({ events, checks }) =>
    `<div class="adc">${events.filter(e => e.allDay).map(e => `<div class="ad-ev ${checks[e.id] ? "done" : ""}" style="${catStyle(e)}" data-open data-key="${e.date}" data-id="${esc(e.id)}" role="button" tabindex="0">
      ${checkbox(e, !!checks[e.id], "gchk")}<span>${esc(e.title)}</span></div>`).join("")}</div>`).join("")}</div>` : "";

  let hours = "";
  for (let h = startH + 1; h < endH; h++) hours += `<div style="top:${(h - startH) * HOUR}px">${fmtTime(`${h}:00`).replace(":00", "")}</div>`;

  const cols = days.map(({ key, events, checks }) => {
    const blocks = layoutDay(events).map(({ e, s, en, left, width, z }) => {
      const h = Math.max((en - s) / 60 * HOUR, 13) - 1;
      const done = !!checks[e.id];
      return `<div class="gev ${h < 26 ? "slim" : ""} ${done ? "done" : ""} ${isNow(e) ? "now" : ""}" style="${catStyle(e)};top:${y(s) + 1}px;height:${h}px;left:${left}%;width:calc(${width}% - 3px);z-index:${z}"
        data-open data-key="${key}" data-id="${esc(e.id)}" role="button" tabindex="0" title="${esc(e.title)} · ${fmtRange(e)}">
        ${checkbox(e, done, "gchk")}<div class="gev-title">${esc(e.title)}</div>${h > 40 ? `<div class="gev-time">${fmtRange(e)}</div>` : ""}</div>`;
    }).join("");
    const nowLine = key === todayKey && nowMin >= startH * 60 && nowMin <= endH * 60 ? `<div class="now-line" style="top:${y(nowMin)}px"></div>` : "";
    return `<div class="col ${key === todayKey ? "today" : ""}" style="height:${height}px">${blocks}${nowLine}</div>`;
  }).join("");

  $("#gridView").innerHTML = `<div class="grid-card" style="--hour:${HOUR}px">
    <div class="g-row"><div></div>${heads}</div>${allDay}
    <div class="g-row g-body"><div class="hours" style="height:${height}px">${hours}</div>${cols}</div></div>`;
}

function renderPast() {
  const cur = currentMonKey(), weeks = [];
  for (let m = mondayOf(parseKey(TRACKING_START)); keyOf(m) < cur; m = addDays(m, 7)) weeks.push(keyOf(m));
  if (!weeks.length) { $("#pastList").innerHTML = `<li class="empty">Your first past week will appear here next Monday.</li>`; return; }
  $("#pastList").innerHTML = weeks.reverse().map(wk => {
    const { total, done } = weekStats(wk);
    const pct = total ? Math.round(done / total * 100) : 0;
    return `<li><button data-week="${wk}" class="${wk === viewKey() ? "active" : ""}">
      <span class="pw-range">${weekLabel(parseKey(wk))}</span><span class="mini"><span style="width:${pct}%"></span></span>
      <span class="pw-score">${done}/${total} done</span></button></li>`;
  }).join("");
}

/* Running lists: carry over every week. A checked item keeps its
   check-off date and is cleared once that day has passed. */
const LISTS = {
  todos:     { seed: () => STARTER_TODOS,     empty: "All caught up." },
  groceries: { seed: () => STARTER_GROCERIES, empty: "Your list is empty." },
};
function loadList(name) {
  let items = Store.getList(name).slice();
  const seeded = new Set(Store.getSeeded(name));
  const fresh = LISTS[name].seed().filter(t => !seeded.has(t.id));
  if (fresh.length) {
    items = items.concat(fresh.map(t => ({ id: t.id, text: t.text, done: null })));
    Store.setSeeded(name, [...seeded, ...fresh.map(t => t.id)]);
  }
  const kept = items.filter(t => !t.done || t.done >= todayKey);   // clear items checked on an earlier day
  if (fresh.length || kept.length !== items.length) Store.setList(name, kept);
  return kept;
}
function renderLists() {
  for (const name of Object.keys(LISTS)) {
    const items = loadList(name);
    const sorted = [...items.filter(t => !t.done), ...items.filter(t => t.done)];
    const open = items.filter(t => !t.done).length;
    $("#" + name + "List").innerHTML = sorted.length ? sorted.map(t => `<li class="${t.done ? "done" : ""}">
      <label class="check"><input type="checkbox" data-list="${name}" data-id="${esc(t.id)}" ${t.done ? "checked" : ""} aria-label="${esc(t.text)}"></label>
      <span>${esc(t.text)}</span>
      <button class="del" data-del="${name}" data-id="${esc(t.id)}" aria-label="Remove ${esc(t.text)}">×</button></li>`).join("")
      : `<li class="empty">${LISTS[name].empty}</li>`;
    $("#" + name + "Count").textContent = open ? `${open} left` : "";
  }
}
function updateList(name, fn) { Store.setList(name, fn(Store.getList(name).slice())); renderLists(); }

function render() {
  const now = new Date();
  todayKey = keyOf(now);
  nowMin = now.getHours() * 60 + now.getMinutes();
  const wk = viewKey(), cur = currentMonKey();

  const days = Array.from({ length: 7 }, (_, i) => {
    const d = addDays(viewMonday, i), key = keyOf(d);
    return { d, key, events: eventsForDate(key), checks: Store.getChecks(key) };
  });

  $("#weekLabel").textContent = weekLabel(viewMonday);
  $("#weekSub").textContent = wk === cur ? "This week" : wk < cur ? "Past week" : "Upcoming";
  $("#todayBtn").classList.toggle("is-current", wk === cur);
  const banner = $("#pastBanner");
  banner.hidden = !isPastWeek();
  banner.classList.toggle("editing", editMode);
  $("#pastBannerText").textContent = editMode ? "Editing a past week" : "Past week · view only";
  $("#editBtn").textContent = editMode ? "Done" : "Fix a check-off";

  const { total, done } = weekStats(wk);
  $("#progressFill").style.width = (total ? done / total * 100 : 0) + "%";
  $("#progressText").textContent = `${done}/${total} done`;

  renderList(days);
  renderGrid(days);
  renderPast();
  if (openEvent && openEvent.mode === "view") fillSheet();
}
function renderAll() { render(); renderLists(); }

$("#legend").innerHTML = Object.values(CATEGORIES)
  .map(c => `<span class="chip" style="--ac:${c.ac}"><i></i>${esc(c.label)}</span>`).join("");

/* ===================== details sheet ===================== */
// openEvent = { key, id, mode: "view" | "edit" | "new" | "scope", action: "save" | "delete", draft }
const findEvent = (key, id) => eventsForDate(key).find(x => x.id === id);
const longDate = d => `${DAY_NAMES[(d.getDay() + 6) % 7]}, ${MONTHS[d.getMonth()]} ${d.getDate()}`;

function fillSheet() {
  const sheet = $("#sheet");
  const { key, id, mode } = openEvent;
  if (mode === "new") return fillForm(sheet, null);
  const e = findEvent(key, id);
  if (!e) return closeSheet();
  sheet.style.cssText = catStyle(e);
  if (mode === "edit") return fillForm(sheet, e);
  if (mode === "scope") return fillScope(sheet, e);

  const d = parseKey(key), c = catOf(e), done = !!Store.getChecks(key)[id];
  sheet.innerHTML = `
    <span class="cat"><i></i>${esc(c.label)}</span>
    <h3 id="sheetTitle">${esc(e.title)}</h3>
    <dl>
      <dt>Date</dt><dd>${longDate(d)}${isWeekly(e) ? ` <span class="repeat-note">· repeats weekly</span>` : ""}</dd>
      <dt>Time</dt><dd>${fmtRange(e)}</dd>
      ${e.location ? `<dt>Where</dt><dd><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.location)}" target="_blank" rel="noopener">${esc(e.location)}</a></dd>` : ""}
      ${e.notes ? `<dt>Notes</dt><dd>${esc(e.notes)}</dd>` : ""}
    </dl>
    <div class="sheet-actions">
      <button class="btn-done ${done ? "is-done" : ""}" id="sheetDone" ${locked() ? "disabled" : ""}>${done ? "Undo" : "Mark done"}</button>
      <button class="btn-close" id="sheetClose">Close</button>
    </div>
    ${locked() ? `<p class="lock-note">Past week — tap “Fix a check-off” to change this.</p>`
      : `<div class="sheet-links"><button id="sheetEdit">Edit</button><button id="sheetDelete" class="danger">Delete</button></div>`}`;
  $("#sheetClose").onclick = closeSheet;
  $("#sheetDone").onclick = () => { if (locked()) return; Store.setCheck(key, id, !done); render(); };
  if (!locked()) {
    $("#sheetEdit").onclick = () => { openEvent.mode = "edit"; fillSheet(); };
    $("#sheetDelete").onclick = () => {
      if (isWeekly(e)) { openEvent.mode = "scope"; openEvent.action = "delete"; return fillSheet(); }
      if (confirm(`Delete “${e.title}”?`)) { deleteEvent(e, "one"); closeSheet(); }
    };
  }
}

function fillForm(sheet, e) {
  const isNew = !e;
  const draft = openEvent.draft || (isNew
    ? { title: "", date: openEvent.key, allDay: false, start: "09:00", end: "10:00", category: "wellness", location: "", notes: "", repeat: false }
    : { ...fieldsOf(e), date: e.date });
  if (isNew) sheet.style.cssText = catStyle({ category: draft.category });
  sheet.innerHTML = `
    <span class="cat"><i></i>${isNew ? "New event" : "Edit event"}</span>
    <form class="evform" id="evForm" novalidate>
      <label>Title<input name="title" value="${esc(draft.title)}" placeholder="What's happening?" autocomplete="off"></label>
      <label>${e && isWeekly(e) ? "Date (this week's)" : "Date"}<input type="date" name="date" value="${esc(draft.date)}"></label>
      <label class="toggle"><input type="checkbox" name="allDay" ${draft.allDay ? "checked" : ""}> All day</label>
      <div class="two" id="timeRow" ${draft.allDay ? "hidden" : ""}>
        <label>Start<input type="time" name="start" value="${esc(draft.start)}"></label>
        <label>End<input type="time" name="end" value="${esc(draft.end)}"></label>
      </div>
      <label>Category<select name="category">${Object.entries(CATEGORIES).map(([k, c]) =>
        `<option value="${k}" ${k === draft.category ? "selected" : ""}>${esc(c.label)}</option>`).join("")}</select></label>
      <label>Location<input name="location" value="${esc(draft.location)}" placeholder="Optional" autocomplete="off"></label>
      <label>Notes<textarea name="notes" placeholder="Optional">${esc(draft.notes)}</textarea></label>
      ${isNew ? `<label class="toggle"><input type="checkbox" name="repeat" ${draft.repeat ? "checked" : ""}> Repeats every week</label>` : ""}
      <p class="form-err" id="formErr"></p>
      <div class="sheet-actions" style="margin-top:0">
        <button type="submit" class="btn-done">Save</button>
        <button type="button" class="btn-close" id="formCancel">Cancel</button>
      </div>
    </form>`;
  const form = $("#evForm");
  form.allDay.onchange = () => { $("#timeRow").hidden = form.allDay.checked; };
  form.category.onchange = () => { sheet.style.setProperty("--ac", CATEGORIES[form.category.value].ac); };
  $("#formCancel").onclick = () => { if (isNew) closeSheet(); else { openEvent.mode = "view"; openEvent.draft = null; fillSheet(); } };
  form.onsubmit = ev => {
    ev.preventDefault();
    const v = {
      title: form.title.value.trim(), date: form.date.value, allDay: form.allDay.checked,
      start: form.start.value, end: form.end.value, category: form.category.value,
      location: form.location.value.trim(), notes: form.notes.value.trim(), repeat: !!(form.repeat && form.repeat.checked),
    };
    const err = !v.title ? "Please add a title." : !v.date ? "Please pick a date."
      : !v.allDay && (!v.start || !v.end) ? "Please add a start and end time."
      : !v.allDay && toMin(v.end) <= toMin(v.start) ? "End time needs to be after the start time." : "";
    if (err) { $("#formErr").textContent = err; return; }
    if (v.allDay) { v.start = ""; v.end = ""; }
    if (isNew) { addEvent(v); return finishEdit(v.date); }
    if (isWeekly(e)) { openEvent.draft = v; openEvent.mode = "scope"; openEvent.action = "save"; return fillSheet(); }
    saveEvent(e, v, "one"); finishEdit(v.date);
  };
  if (isNew) setTimeout(() => form.title.focus(), 50);
}

function fillScope(sheet, e) {
  const del = openEvent.action === "delete";
  sheet.innerHTML = `
    <span class="cat"><i></i>Repeating event</span>
    <h3 id="sheetTitle">${del ? "Delete" : "Save changes to"} “${esc(e.title)}”</h3>
    <p class="scope-text">This event repeats every week. ${del ? "Delete" : "Change"}:</p>
    <div class="scope">
      <button class="primary" data-scope="one">Only ${longDate(parseKey(e.date))}</button>
      <button data-scope="future">This and all following weeks</button>
      <button class="plain" data-scope="cancel">Cancel</button>
    </div>`;
  sheet.querySelectorAll("[data-scope]").forEach(b => b.onclick = () => {
    const scope = b.dataset.scope;
    if (scope === "cancel") { openEvent.mode = del ? "view" : "edit"; return fillSheet(); }
    if (del) { deleteEvent(e, scope); return closeSheet(); }
    const v = openEvent.draft;
    saveEvent(e, v, scope); finishEdit(v.date);
  });
}

/* ----- saving changes (all through Store, so they sync) ----- */
const newId = () => "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const dayKeyOf = key => DAY_KEYS[(parseKey(key).getDay() + 6) % 7];
const weekOf = key => keyOf(mondayOf(parseKey(key)));
function updateData(k, fallback, fn) { Store.setData(k, fn(JSON.parse(JSON.stringify(Store.getData(k, fallback))))); }

function addEvent(v) {
  const base = { id: newId(), ...fieldsOf(v) };
  const ev = v.repeat ? { ...base, day: dayKeyOf(v.date), from: weekOf(v.date) } : { ...base, date: v.date };
  updateData("ev:added", [], list => [...list, ev]);
}
function saveEvent(e, v, scope) {
  const fields = fieldsOf(v);
  if (e.source === "user-once") {
    return updateData("ev:added", [], list => list.map(x => x.id === e.id ? { id: x.id, ...fields, date: v.date } : x));
  }
  if (scope === "future") {
    const from = weekOf(e.date);
    updateData("ev:series", {}, all => {
      all[e.id] = [...(all[e.id] || []).filter(c => c.from < from), { from, fields, day: dayKeyOf(v.date) }];
      return all;
    });
    return updateData("ev:over", {}, all => { delete all[e.overKey]; return all; });
  }
  updateData("ev:over", {}, all => { all[e.overKey] = { fields, date: v.date }; return all; });
}
function deleteEvent(e, scope) {
  if (e.source === "user-once") return updateData("ev:added", [], list => list.filter(x => x.id !== e.id));
  if (scope === "future") {
    const from = weekOf(e.date);
    updateData("ev:series", {}, all => { all[e.id] = [...(all[e.id] || []).filter(c => c.from < from), { from, deleted: true }]; return all; });
    return updateData("ev:over", {}, all => { delete all[e.overKey]; return all; });
  }
  updateData("ev:over", {}, all => { all[e.overKey] = { deleted: true }; return all; });
}
function finishEdit(date) {
  closeSheet();
  const mon = mondayOf(parseKey(date));
  if (keyOf(mon) !== viewKey()) viewMonday = mon;
  render();
}

function openSheet(key, id) { openEvent = { key, id, mode: "view" }; fillSheet(); $("#modal").hidden = false; $("#sheetClose")?.focus(); }
function openNew() {
  const cur = viewKey() === currentMonKey();
  openEvent = { key: cur ? todayKey : viewKey(), id: null, mode: "new" };
  fillSheet(); $("#modal").hidden = false;
}
function closeSheet() { openEvent = null; $("#modal").hidden = true; }
$("#addBtn").onclick = openNew;
$("#modal").addEventListener("click", e => { if (e.target.id === "modal" && (!openEvent || openEvent.mode === "view")) closeSheet(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && openEvent) closeSheet();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-open]")) { e.preventDefault(); openSheet(e.target.dataset.key, e.target.dataset.id); }
});

/* ===================== events ===================== */
document.addEventListener("change", e => {
  const t = e.target;
  if (t.matches("input[data-check]")) {
    if (locked()) { t.checked = !t.checked; return; }
    Store.setCheck(t.dataset.key, t.dataset.id, t.checked);
    render();
  } else if (t.matches("input[data-list]")) {
    const on = t.checked, id = t.dataset.id;
    updateList(t.dataset.list, items => items.map(x => x.id === id ? { ...x, done: on ? todayKey : null } : x));
  }
});
document.addEventListener("click", e => {
  if (e.target.closest("input, label.check")) return;
  const card = e.target.closest("[data-open]");
  if (card) return openSheet(card.dataset.key, card.dataset.id);
  const del = e.target.closest("[data-del]");
  if (del) { const id = del.dataset.id; return updateList(del.dataset.del, items => items.filter(x => x.id !== id)); }
  const wkBtn = e.target.closest("[data-week]");
  if (wkBtn) { goToWeek(parseKey(wkBtn.dataset.week)); window.scrollTo({ top: 0, behavior: "smooth" }); }
});

function goToWeek(mon) { viewMonday = mondayOf(mon); editMode = false; renderAll(); }
$("#prevBtn").onclick = () => goToWeek(addDays(viewMonday, -7));
$("#nextBtn").onclick = () => goToWeek(addDays(viewMonday, 7));
$("#todayBtn").onclick = () => { goToWeek(new Date()); scrollToToday(); };
$("#editBtn").onclick = () => { editMode = !editMode; renderAll(); };

document.querySelectorAll("form[data-add]").forEach(form => form.addEventListener("submit", e => {
  e.preventDefault();
  const input = form.querySelector("input"), text = input.value.trim();
  if (!text) return;
  const id = "u" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  updateList(form.dataset.add, items => [...items, { id, text, done: null }]);
  input.value = ""; input.focus();
}));

function scrollToToday() {
  if (!window.matchMedia("(max-width: 899px)").matches) return;
  setTimeout(() => document.getElementById("day-" + todayKey)?.scrollIntoView({ behavior: "smooth", block: "start" }), 120);
}

/* ===================== sync panel ===================== */
const SYNC_TEXT = { off: "", signedout: "Not signed in", syncing: "Syncing…", synced: "Synced", offline: "Offline · will sync later", error: "Couldn't sync" };
function renderSync() {
  if (!Store.syncEnabled()) return;
  const st = Store.status(), signedIn = !!Store.email() && st.state !== "signedout";
  $("#syncPanel").hidden = false;
  $("#syncPanel").classList.toggle("needs-signin", !signedIn);
  $("#syncState").textContent = SYNC_TEXT[st.state] || "";
  $("#syncState").classList.toggle("bad", st.state === "error" || st.state === "signedout");
  $("#signInForm").hidden = signedIn;
  $("#signedIn").hidden = !signedIn;
  $("#syncWho").textContent = Store.email();
  if (st.msg) $("#syncErr").textContent = st.msg;
}
Store.onStatus(renderSync);
Store.onChange(() => { render(); renderLists(); });
$("#signInForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = e.target.querySelector("button");
  btn.disabled = true; btn.textContent = "Signing in…"; $("#syncErr").textContent = "";
  try { await Store.signIn($("#syncEmail").value.trim(), $("#syncPass").value); $("#syncPass").value = ""; }
  catch (err) { $("#syncErr").textContent = err instanceof TypeError ? "Can't reach the server — check your connection." : err.message; }
  btn.disabled = false; btn.textContent = "Sign in";
  renderSync();
});
$("#signOutBtn").onclick = () => { Store.signOut(); renderSync(); };

/* ===================== start ===================== */
renderSync();
Store.init().then(() => {
  renderAll();
  scrollToToday();
  let lastDay = todayKey;
  setInterval(() => {            // keeps the "now" line and today highlight fresh
    render();
    if (todayKey !== lastDay) { lastDay = todayKey; renderLists(); }   // midnight: clear yesterday's checked items
  }, 30000);
});
</script>
</body>
</html>
